<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>StayOne | 予約確定</title>
  <style>
    body { margin:0; font-family: Helvetica, Arial, sans-serif; background:#f7f7f7; }
    header{
      background:#00897b; color:#fff; padding:12px 20px;
      display:flex; align-items:center; justify-content:space-between;
      font-size:18px; font-weight:600;
    }
    header a{ color:#fff; text-decoration:none; font-size:14px; font-weight:500; }
    main{ max-width: 980px; margin: 26px auto 90px; padding: 0 16px; }

    .card{
      background:#fff; border:1px solid #e0e0e0; border-radius:12px;
      padding:18px 18px 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.06);
    }

    .success-wrap{
      display:flex; gap:14px; align-items:flex-start;
    }

    .success-icon{
      width:46px; height:46px; border-radius:12px;
      background:#e0f2f1; border:1px solid #b2dfdb;
      display:flex; align-items:center; justify-content:center;
      flex:0 0 auto;
      font-size:22px; color:#00695c;
    }

    .title{ margin:0; font-size:22px; color:#333; }
    .sub{ margin-top:6px; font-size:13px; color:#666; line-height:1.6; }

    .divider{ height:1px; background:#eee; margin:14px 0; }

    .kv{ display:grid; grid-template-columns: 140px 1fr; gap:8px 12px; }
    .k{ font-size:12px; color:#666; }
    .v{ font-size:13px; color:#333; font-weight:600; }

    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .btn{
      padding:10px 14px; border-radius:10px; border:1px solid #cfd8dc;
      background:#fff; cursor:pointer; font-size:13px; font-weight:700;
      text-decoration:none; color:#333; display:inline-flex; align-items:center;
    }
    .btn:hover{ background:#f5f5f5; }
    .btn-primary{
      background:#00897b; border-color:#00897b; color:#fff;
    }
    .btn-primary:hover{ background:#00796b; }

    footer{
      background:#9e9e9e; color:#fff; padding:10px 20px; font-size:12px;
      position:fixed; bottom:0; width:100%; display:flex; gap:15px;
    }
    footer a{ color:#fff; text-decoration:none; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <div>StayOne</div>
    <a href="#">ダッシュボードへ</a>
  </header>

  <main>
    <section class="card">
      <div class="success-wrap">
        <div class="success-icon">✓</div>
        <div>
          <h1 class="title">予約を確定しました</h1>
          <div class="sub">
            ゲストへ確定通知を送信しました（想定）。<br>
            必要であれば、チェックイン方法や注意事項をメッセージで送ってください。
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- ここは予約詳細から引き継ぐ想定（いまは固定表示） -->
      <div class="kv">
        <div class="k">ゲスト</div><div class="v">John Smith</div>
        <div class="k">宿泊日程</div><div class="v">2026/03/01 – 2026/03/07</div>
        <div class="k">泊数</div><div class="v">6 nights</div>
        <div class="k">ステータス</div><div class="v">Confirmed</div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="host_yoyakushosai.html">予約詳細に戻る</a>
        <a class="btn" href="#">ゲストにメッセージ</a>
        <a class="btn" href="#">ダッシュボードへ</a>
      </div>
    </section>
  </main>

  <footer>
    <a href="#">お問い合わせ</a>
    <a href="#">利用規約</a>
    <a href="#">プライバシーポリシー</a>
  </footer>
</body>
</html>
