<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StayOne | Pay (JPYC)</title>
  <style>
    :root{
      --brand:#00897b;
      --brand-dark:#00796b;
      --bg:#f7f7f7;
      --card:#ffffff;
      --ink:#333333;
      --muted:#666666;
      --line:#e0e0e0;
      --radius:12px;
      --shadow:0 0 10px rgba(0,0,0,0.06);
      --ok:#166534;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--ink);
    }

    header{
      background:var(--brand);
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      font-size:18px;
      font-weight:600;
    }

    main{
      max-width:720px;
      margin:24px auto 80px;
      padding:0 16px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      border:1px solid var(--line);
      padding:18px;
      box-shadow:var(--shadow);
    }

    h1{ font-size:22px; margin:0 0 6px; }
    .subtitle{ font-size:13px; color:var(--muted); margin-bottom:14px; }

    .kv{
      display:grid;
      grid-template-columns:140px 1fr;
      gap:8px 12px;
      margin:12px 0;
    }
    .k{ font-size:12px; color:#666; }
    .v{ font-size:14px; font-weight:800; }

    .divider{ height:1px; background:var(--line); margin:16px 0; }

    .btn{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #cfd8dc;
      background:#fff;
      cursor:pointer;
      font-size:14px;
      font-weight:900;
    }
    .btn-primary{
      background:var(--brand);
      border-color:var(--brand);
      color:#fff;
    }
    .btn-primary:hover{ background:var(--brand-dark); }
    .btn[disabled]{
      opacity:.5;
      cursor:not-allowed;
    }

    .status{
      font-size:13px;
      margin-top:10px;
      color:#666;
    }
    .status.ok{ color:var(--ok); font-weight:700; }

    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      background:rgba(15,23,42,.95);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      opacity:0;
      transition:.2s;
    }
    .toast.show{ opacity:1; }

    footer{
      background:#9e9e9e;
      color:#fff;
      padding:10px 20px;
      font-size:12px;
      position:fixed;
      bottom:0;
      width:100%;
      display:flex;
      gap:15px;
    }
  </style>
</head>
<body>
<header>
  <div>StayOne</div>
  <div>Payment</div>
</header>

<main>
  <section class="card">
    <h1>Pay with JPYC</h1>
    <p class="subtitle">Minimal payment screen</p>

    <div class="kv">
      <div class="k">To (Host)</div><div class="v">kodience</div>
      <div class="k">Amount</div><div class="v">6,300 JPYC</div>
      <div class="k">Wallet</div><div class="v" id="walletAddr">Not connected</div>
    </div>

    <div class="divider"></div>

    <button class="btn" id="connectBtn">Connect Wallet</button>

    <div class="divider"></div>

    <button class="btn btn-primary" id="payBtn" disabled>
      Pay 6,300 JPYC
    </button>

    <div class="status" id="status">
      Please connect your wallet to continue.
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<footer>
  <span>© StayOne</span>
</footer>

<script>
  const connectBtn = document.getElementById("connectBtn");
  const payBtn = document.getElementById("payBtn");
  const walletAddr = document.getElementById("walletAddr");
  const status = document.getElementById("status");
  const toast = document.getElementById("toast");

  let connected = false;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1400);
  }

  connectBtn.onclick = () => {
    // mock wallet connection
    connected = true;
    walletAddr.textContent = "0x7B3a…2345";
    status.textContent = "Wallet connected.";
    status.classList.add("ok");
    payBtn.disabled = false;
    showToast("Wallet connected (mock)");
  };

  payBtn.onclick = () => {
    // mock payment
    showToast("JPYC payment sent (mock)");
  };
</script>
</body>
</html>
